configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: "alb"
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: "/"
      alb.ingress.kubernetes.io/group.name: "spot-ingress"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/scheme: "internet-facing"
      alb.ingress.kubernetes.io/security-groups: "spot-dev-alb-sg"
      alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09"
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/success-codes: "200"
      alb.ingress.kubernetes.io/tags: "Name=spot-dev-alb, Environment=dev,Team=spot, ManagedBy=lbc"
      alb.ingress.kubernetes.io/target-type: "ip"
    hostname: "argocd.hbksv.com"
