applications:
  root-prod:
    namespace: argocd
    finalizers: # 기본 동작은 포어그라운드 삭제
      - resources-finalizer.argocd.argoproj.io
    project: "default"
    destination:
      namespace: "argocd"
      server: https://kubernetes.default.svc
    source:
      path: k8s/argo/apps # Application helm 템플릿이 저장된 경로
      repoURL: https://github.com/first-lounge/Spot.git # Application이 저장된 매니페스트 파일
      helm:
        valueFiles:
          - values-prod.yaml
      targetRevision: dev # main
    syncPolicy:
      # prod 구축 완료 시 automated 블록 삭제
      automated:
        prune: true
        selfHeal: true
