apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

# configs.env를 네임스페이스별 ConfigMap으로 생성
configMapGenerator:
  - name: spot-env
    namespace: spot
    envs:
      - configs.env

  - name: infra-env
    namespace: infra
    envs:
      - configs.env
