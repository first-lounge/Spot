apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spot-secrets-es
  namespace: spot
spec:
  refreshInterval: 1h
  secretStoreRef: # Secret을 가져올 ClusterSecretStore 작성
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: spot-secrets # k8s에 만들어질 Secret 이름
    creationPolicy: Owner
  data:
    # Redis (ElastiCache)
    - secretKey: SPRING_DATA_REDIS_HOST
      remoteRef:
        key: /spot/prod/cache/redis_endpoint
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: /spot/prod/cache/redis_password

    # JWT
    - secretKey: SPRING_JWT_SECRET
      remoteRef:
        key: /spot/prod/jwt/secret

    # Mail
    - secretKey: EMAIL_USERNAME
      remoteRef:
        key: /spot/prod/mail/username

    - secretKey: EMAIL_PASSWORD
      remoteRef:
        key: /spot/prod/mail/password

    # Toss
    - secretKey: TOSS_SECRET_KEY
      remoteRef:
        key: /spot/prod/toss/secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spot-user-secrets-es
  namespace: spot
spec:
  refreshInterval: 1h
  secretStoreRef: # Secret을 가져올 ClusterSecretStore 작성
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: spot-user-secrets # k8s에 만들어질 Secret 이름
    creationPolicy: Owner
    template:
      data:
        SPRING_DATASOURCE_URL: "{{ .SPRING_DATASOURCE_URL }}"
        SPRING_DATASOURCE_USERNAME: "{{ (.rds_account | fromJson).username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ (.rds_account | fromJson).password }}"
  data:
    # RDS URL
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: /spot/prod/database/user/url
  dataFrom:
    # RDS 아이디 & 비밀번호
    - sourceRef:
        storeRef:
          name: secrets-manager
          kind: ClusterSecretStore
      find:
        tags:
          Name: spot-prod-user-rds
      rewrite:
        - regexp:
            source: ".*"
            target: "rds_account"
---
