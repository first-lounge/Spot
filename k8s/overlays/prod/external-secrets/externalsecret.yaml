apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-secrets-es
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef: # Secret을 가져올 ClusterSecretStore 작성
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: infra-secrets # k8s에 만들어질 Secret 이름
    creationPolicy: Owner
    template:
      data:
        USER_DB_HOST: "{{ .USER_DB_HOST }}"
        ORDER_DB_HOST: "{{ .ORDER_DB_HOST }}"
        PAYMENT_DB_HOST: "{{ .PAYMENT_DB_HOST }}"
        STORE_DB_HOST: "{{ .STORE_DB_HOST }}"
        TEMPORAL_DB_HOST: "{{ .TEMPORAL_DB_HOST }}"

        USER_DB_USERNAME: "{{ (.user_account | fromJson).username }}"
        USER_DB_PASSWORD: "{{ (.user_account | fromJson).password }}"
        STORE_DB_USERNAME: "{{ (.store_account | fromJson).username }}"
        STORE_DB_PASSWORD: "{{ (.store_account | fromJson).password }}"
        ORDER_DB_USERNAME: "{{ (.order_account | fromJson).username }}"
        ORDER_DB_PASSWORD: "{{ (.order_account | fromJson).password }}"
        PAYMENT_DB_USERNAME: "{{ (.payment_account | fromJson).username }}"
        PAYMENT_DB_PASSWORD: "{{ (.payment_account | fromJson).password }}"
        TEMPORAL_DB_USERNAME: "{{ (.temporal_account | fromJson).username }}"
        TEMPORAL_DB_PASSWORD: "{{ (.temporal_account | fromJson).password }}"
  data:
    # RDS
    - secretKey: USER_DB_HOST
      remoteRef:
        key: /spot/prod/database/user/host
    - secretKey: ORDER_DB_HOST
      remoteRef:
        key: /spot/prod/database/order/host
    - secretKey: PAYMENT_DB_HOST
      remoteRef:
        key: /spot/prod/database/payment/host
    - secretKey: STORE_DB_HOST
      remoteRef:
        key: /spot/prod/database/store/host
    - secretKey: TEMPORAL_DB_HOST
      remoteRef:
        key: /spot/prod/database/temporal/host
  dataFrom:
    # RDS 아이디 & 비밀번호
    - sourceRef:
        storeRef:
          name: secrets-manager
          kind: ClusterSecretStore
      find:
        tags:
          Name: spot-prod-user-rds
      rewrite:
        - regexp:
            source: ".*"
            target: "user_account"
    - sourceRef:
        storeRef:
          name: secrets-manager
          kind: ClusterSecretStore
      find:
        tags:
          Name: spot-prod-store-rds
      rewrite:
        - regexp:
            source: ".*"
            target: "store_account"
    - sourceRef:
        storeRef:
          name: secrets-manager
          kind: ClusterSecretStore
      find:
        tags:
          Name: spot-prod-order-rds
      rewrite:
        - regexp:
            source: ".*"
            target: "order_account"
    - sourceRef:
        storeRef:
          name: secrets-manager
          kind: ClusterSecretStore
      find:
        tags:
          Name: spot-prod-payment-rds
      rewrite:
        - regexp:
            source: ".*"
            target: "payment_account"
    - sourceRef:
        storeRef:
          name: secrets-manager
          kind: ClusterSecretStore
      find:
        tags:
          Name: spot-prod-temporal-rds
      rewrite:
        - regexp:
            source: ".*"
            target: "temporal_account"
---
