apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-relay
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rds-relay
  template:
    metadata:
      labels:
        app: rds-relay
    spec:
      nodeSelector:
        workload: infra
      tolerations:
        - key: spot
          value: infra
          effect: NoSchedule
      containers:
        - name: user
          image: alpine/socat
          command: ["socat"]
          args: ["TCP-LISTEN:5433,fork,reuseaddr", "TCP:$(DB_HOST):5432"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: infra-secrets, key: USER_DB_HOST }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }

        - name: order
          image: alpine/socat
          command: ["socat"]
          args: ["TCP-LISTEN:5434,fork,reuseaddr", "TCP:$(DB_HOST):5432"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: infra-secrets, key: ORDER_DB_HOST }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }

        - name: store
          image: alpine/socat
          command: ["socat"]
          args: ["TCP-LISTEN:5435,fork,reuseaddr", "TCP:$(DB_HOST):5432"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: infra-secrets, key: STORE_DB_HOST }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }

        - name: payment
          image: alpine/socat
          command: ["socat"]
          args: ["TCP-LISTEN:5436,fork,reuseaddr", "TCP:$(DB_HOST):5432"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: infra-secrets, key: PAYMENT_DB_HOST }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }

        - name: temporal
          image: alpine/socat
          command: ["socat"]
          args: ["TCP-LISTEN:5437,fork,reuseaddr", "TCP:$(DB_HOST):5432"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: infra-secrets, key: TEMPORAL_DB_HOST }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rds-tunnel
  namespace: infra
spec:
  ports:
    - name: user
      port: 5433
      targetPort: 5433
    - name: order
      port: 5434
      targetPort: 5434
    - name: store
      port: 5435
      targetPort: 5435
    - name: payment
      port: 5436
      targetPort: 5436
    - name: temporal
      port: 5437
      targetPort: 5437

  selector:
    app: rds-relay
