apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-nodes
  namespace: infra
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 3
  roles:
    - broker
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        class: ebs-sc
        deleteClaim: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/name: kafka-cluster-kafka
              strimzi.io/broker-role: "true"
              strimzi.io/controller-role: "true"
      tolerations:
        - key: spot
          operator: Equal
          value: infra
          effect: NoSchedule
      affinity:
        # 같은 노드 그룹(infra)에 배포되게 하는 설정
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: [infra]
        # 브로커가 같은 노드에 배포되지 않게 하는 설정
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/name: kafka-cluster-kafka
              topologyKey: "kubernetes.io/hostname" # 노드 기준
