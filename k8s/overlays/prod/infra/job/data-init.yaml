apiVersion: batch/v1
kind: Job
metadata:
  name: data-init
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  template:
    spec:
      nodeSelector:
        workload: infra
      tolerations:
        - key: spot
          value: infra
          effect: NoSchedule
      serviceAccountName: data-init-job-sa
      volumes:
        - name: data
          emptyDir: {}

      initContainers:
        - name: download-data
          image: amazon/aws-cli:2.17.0
          args:
            [
              "aws",
              "s3",
              "cp",
              "s3://spot-dummy-data-bucket/seed/",
              "/data/",
              "--recursive",
            ]

          volumeMounts:
            - name: data
              mountPath: /data

      containers:
        - name: data-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
                
              for svc in user store order payment; do
                case $svc in
                  user) H=$USER_DB_HOST; U=$USER_DB_USERNAME; P=$USER_DB_PASSWORD; D=$USER_DB_NAME;;
                  store) H=$STORE_DB_HOST; U=$STORE_DB_USERNAME; P=$STORE_DB_PASSWORD; D=$STORE_DB_NAME;;
                  order) H=$ORDER_DB_HOST; U=$ORDER_DB_USERNAME; P=$ORDER_DB_PASSWORD; D=$ORDER_DB_NAME;;
                  payment) H=$PAYMENT_DB_HOST; U=$PAYMENT_DB_USERNAME; P=$PAYMENT_DB_PASSWORD; D=$PAYMENT_DB_NAME;;
                esac
                export PGHOST="$H" PGUSER="$U" PGPASSWORD="$P" PGDATABASE="$D"

                until psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_name = 'p_$svc'" | grep -q 1 ; 
                do
                  echo "waiting for tables in $D"; sleep 10
                done

                TABLE="data_init"
                EXISTS=$(psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = '$TABLE'")

                # Job 중복 실행 체크
                if [ "$EXISTS" = "1" ]; then
                  echo "$svc: already done, skip"
                  continue
                fi

                # 더미 데이터 삽입
                pg_restore --data-only --no-owner --single-transaction --exit-on-error \
                /data/"$svc"-20261030.dump

                # 삽입 증명용 테이블 생성
                psql -c "CREATE TABLE $TABLE (created_at TIMESTAMP DEFAULT now())"
                psql -c "INSERT INTO $TABLE DEFAULT VALUES"
                echo "$svc: created $TABLE"

              done

          envFrom:
            - secretRef: { name: infra-secrets }
            - configMapRef: { name: infra-env }

          env:
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "15"

          volumeMounts:
            - name: data
              mountPath: /data

      restartPolicy: Never
