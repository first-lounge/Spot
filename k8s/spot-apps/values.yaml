# [1] Ingress 공통 설정
ingress:
  className: "nginx"

  aws:
    enabled: false

  subs:
    - name: spot
      hostname: www
      namespace: spot
      serviceName: spot-gateway
      healthPath: /actuator/health

    - name: kafka
      namespace: infra
      serviceName: kafka-ui-svc
      healthPath: /

    - name: temporal
      namespace: infra
      serviceName: temporal-ui-svc
      healthPath: /

    - name: grafana
      namespace: monitoring
      serviceName: grafana-svc
      healthPath: '/api/health'

# 도메인
domain: spot

# [2] Deployment 공통 설정 (Global)
global:
  name: spot
  namespace: spot
  replicas: 1

  repository: spot-registry.localhost:5000

  # 이미지
  imagePullPolicy: Always

  # 리소스 제한
  requests:
    cpu: '250m'
    memory: '256Mi'
  limits:
    cpu: '500m'
    memory: '512Mi'

# Health Check Probe
probes:
  # 경로
  path: /actuator/health

  startup:
    period: 10
    failureThreshold: 30
  readiness:
    period: 10
    failureThreshold: 12
  liveness:
    period: 10
    failureThreshold: 12

  timeoutSeconds: 5

# [3] app 목록
apps:
  gateway:
    name: spot-gateway
    port: 80
    targetPort: 8080
    imageTag: latest
    dbEnabled: false
    rollout: false

  user:
    name: spot-user
    port: 8081
    imageTag: latest
    dbEnabled: true
    rollout: false

  store:
    name: spot-store
    port: 8083
    imageTag: latest
    dbEnabled: true
    rollout: false

  order:
    name: spot-order
    port: 8082
    imageTag: latest
    dbEnabled: true
    rollout: false

  payment:
    name: spot-payment
    port: 8084
    imageTag: latest
    dbEnabled: true
    rollout: false

# [4] envFrom
envFrom:
  secretName: spot-secrets
  configName: spot-env

# [5] 개별 env 변수
env:
  activeProfile: 'k8s'
  loggingConfig: 'classpath:logback-spring.xml'

# [6] 파일 마운트용 configMap
configMap: spot-app-config
