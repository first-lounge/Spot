apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spot-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoURL }}
    targetRevision: dev
    path: k8s/spot-apps
    helm:
      releaseName: spot
      {{- if .Values.env }}
      valueFiles:
        - values-{{ .Values.env }}.yaml
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: spot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true