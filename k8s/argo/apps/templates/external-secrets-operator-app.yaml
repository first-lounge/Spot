apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers: # 기본 동작은 포어그라운드 삭제
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  sources:
    - repoURL: "https://charts.external-secrets.io"
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        releaseName: external-secrets
        parameters:
            - name: serviceAccount.name
              value: "external-secrets-sa"
            - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
              value: "arn:aws:iam::164076841262:role/spot-{{ .Values.env }}-eso-role"
            {{- if eq .Values.env "prod" }}
            - name: global.nodeSelector.workload
              value: "etc"
            - name: global.tolerations[0].key
              value: "CriticalAddonsOnly"
            - name: global.tolerations[0].effect
              value: "NoSchedule"
            {{- end }}
  destination:
    server: {{ .Values.global.destination.server }}
    namespace: external-secrets
  syncPolicy:
    {{- with $.Values.global.syncPolicy.automated }}
    automated:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true