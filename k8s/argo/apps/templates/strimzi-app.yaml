apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-app
  namespace: argocd
  finalizers: # 기본 동작은 포어그라운드 삭제
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  sources:
    - repoURL: "https://strimzi.io/charts/"
      chart: strimzi-kafka-operator
      targetRevision: 1.0.0
      helm:
        releaseName: strimzi-operator
        parameters:
            - name: "watchNamespaces[0]"
              value: "infra"
            {{- if eq .Values.env "prod" }}
            - name: nodeSelector.workload
              value: "etc"
            - name: tolerations[0].key
              value: "CriticalAddonsOnly"
            - name: tolerations[0].effect
              value: "NoSchedule"
            {{- end }}
  destination:
    server: {{ .Values.global.destination.server }}
    namespace: strimzi
  syncPolicy:
    {{- with $.Values.global.syncPolicy.automated }}
    automated:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true