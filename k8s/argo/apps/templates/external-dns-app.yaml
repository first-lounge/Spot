apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-app
  namespace: argocd
  finalizers: # 기본 동작은 포어그라운드 삭제
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  sources:
    - repoURL: "https://kubernetes-sigs.github.io/external-dns/"
      chart: external-dns
      targetRevision: 1.21.1
      helm:
        releaseName: external-dns
        parameters:
            - name: serviceAccount.name
              value: "external-dns-sa"
            - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
              value: "arn:aws:iam::164076841262:role/spot-{{ .Values.env }}-external_dns-role"
            - name: domainFilters[0]
              value: "hbksv.com"
            - name: policy
              value: "sync"
            - name: provider.name
              value: "aws"
            - name: sources[0]
              value: "ingress"
            - name: txtOwnerId
              value: "{{ .Values.env }}"
            {{- if eq .Values.env "prod" }}
            - name: nodeSelector.workload
              value: "etc"
            - name: tolerations[0].key
              value: "CriticalAddonsOnly"
            - name: tolerations[0].effect
              value: "NoSchedule"
            {{- end }}

  destination:
    server: {{ .Values.global.destination.server }}
    namespace: external-dns
  syncPolicy:
    {{- with $.Values.global.syncPolicy.automated }}
    automated:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true